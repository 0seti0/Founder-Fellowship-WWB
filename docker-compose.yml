services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: unfold
      MYSQL_USER: unfold
      MYSQL_PASSWORD: unfold
      # Local development only. Do not reuse this password outside this compose stack.
      MYSQL_ROOT_PASSWORD: unfold-root
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-punfold-root',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
